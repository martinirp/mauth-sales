<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>M-Auth Admin</title>
  <style>
    :root {
      --bg: #050505;
      --surface: #0a0a0a;
      --surface2: #111111;
      --accent: #c9a227;
      --accent-hover: #b38f22;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #1e1e1e;
      --border-hi: #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .admin-container {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 40px; width: 400px;
      border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: var(--accent); font-weight: 600; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-dim); }
    input {
      width: 100%; padding: 12px;
      background: var(--surface2); border: 1px solid var(--border-hi);
      color: var(--text); border-radius: 4px;
      font-family: monospace; outline: none; transition: border 0.2s;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; padding: 12px;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: 4px;
      font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    #status {
      margin-top: 15px; font-size: 13px; text-align: center;
      padding: 10px; border-radius: 4px; display: none;
    }
    .success { background: rgba(34,197,94,0.1); color: #22c55e; border: 1px solid rgba(34,197,94,0.2); }
    .error { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
  </style>
</head>
<body>
  <div class="admin-container" id="loginBlock">
    <h2 style="margin-bottom: 24px;">Login Restrito</h2>
    <div class="form-group">
      <label>Usuário</label>
      <input type="text" id="loginUsername" placeholder="Seu usuário">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button id="btnLogin">ENTRAR</button>
    <div id="loginStatus" style="margin-top: 15px; font-size: 13px; text-align: center; padding: 10px; border-radius: 4px; display: none;"></div>
  </div>

  <div class="admin-container" id="adminBlock" style="display: none;">
    <div style="margin-bottom: 30px;">
      <h2>Gerador de Licenças (Admin)</h2>
      <p style="font-size:12px; color:var(--text-dim); text-align:center; margin-bottom:24px;">Gera 30 dias de acesso no Gist ignorando as Tibia Coins.</p>
      
      <div class="form-group">
        <label>Nome do Boneco</label>
        <input type="text" id="character" placeholder="Ex: Lord Limbus">
      </div>
      <div class="form-group">
        <label>UUID do Computador (Cliente)</label>
        <input type="text" id="uuid" placeholder="Ex: 50A2F3B9-XXXX...">
      </div>
      
      <button id="btnGenerate">INJETAR NO GIST</button>
      <div id="status"></div>
    </div>
    
    <div style="border-top: 1px solid var(--border-hi); padding-top: 30px;">
      <h2>Configurações Globais</h2>
      <p style="font-size:12px; color:var(--text-dim); text-align:center; margin-bottom:24px;">Alterar Preço e Personagem de Pagamento</p>
      
      <div class="form-group">
        <label>Preço (Tibia Coins)</label>
        <input type="number" id="settingsPrice" placeholder="25">
      </div>
      <div class="form-group">
        <label>Personagem Recebedor</label>
        <input type="text" id="settingsChar" placeholder="Nora Fylap">
      </div>
      
      <button id="btnSettings" style="background: #22c55e; color: #000;">SALVAR CONFIGURAÇÕES</button>
      <div id="settingsStatus" style="margin-top: 15px; font-size: 13px; text-align: center; padding: 10px; border-radius: 4px; display: none;"></div>
    </div>
  </div>

  <script>
    let sessionUser = '';
    let sessionPass = '';

    document.getElementById('btnLogin').addEventListener('click', async () => {
      const u = document.getElementById('loginUsername').value;
      const p = document.getElementById('loginPassword').value;
      const status = document.getElementById('loginStatus');

      if (!u || !p) {
        status.textContent = 'Preencha usuário e senha.';
        status.className = 'error'; status.style.display = 'block'; return;
      }

      status.style.display = 'none';
      document.getElementById('btnLogin').textContent = 'VERIFICANDO...';
      
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        if (!res.ok) throw new Error('Credenciais inválidas');
        
        sessionUser = u;
        sessionPass = p;
        document.getElementById('loginBlock').style.display = 'none';
        document.getElementById('adminBlock').style.display = 'block';
        
        try {
          const settingsRes = await fetch('/api/settings');
          const settings = await settingsRes.json();
          document.getElementById('settingsPrice').value = settings.price;
          document.getElementById('settingsChar').value = settings.targetCharacter;
        } catch (e) { console.error('Erro ao carregar settings', e); }
      } catch (err) {
        status.textContent = err.message;
        status.className = 'error'; status.style.display = 'block';
      } finally {
        document.getElementById('btnLogin').textContent = 'ENTRAR';
      }
    });

    document.getElementById('btnGenerate').addEventListener('click', async () => {
      const btn = document.getElementById('btnGenerate');
      const status = document.getElementById('status');
      
      const character = document.getElementById('character').value;
      const uuid = document.getElementById('uuid').value;
      
      if(!character || !uuid) {
        status.textContent = 'Preencha os dados do cliente.';
        status.className = 'error'; status.style.display = 'block'; return;
      }
      
      btn.textContent = 'INJETANDO...'; btn.disabled = true;
      status.style.display = 'none';
      
      try {
        const res = await fetch('/api/admin/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: sessionUser, password: sessionPass, character, uuid })
        });
        const data = await res.json();
        
        if(!res.ok) throw new Error(data.error || 'Erro desconhecido');
        
        status.textContent = data.message;
        status.className = 'success'; status.style.display = 'block';
        document.getElementById('character').value = '';
        document.getElementById('uuid').value = '';
      } catch(err) {
        status.textContent = err.message;
        status.className = 'error'; status.style.display = 'block';
      } finally {
        btn.textContent = 'INJETAR NO GIST'; btn.disabled = false;
      }
    });

    document.getElementById('btnSettings').addEventListener('click', async () => {
      const btn = document.getElementById('btnSettings');
      const status = document.getElementById('settingsStatus');
      
      const price = document.getElementById('settingsPrice').value;
      const targetCharacter = document.getElementById('settingsChar').value;
      
      if(!price || !targetCharacter) {
        status.textContent = 'Preencha os novos valores.';
        status.className = 'error'; status.style.display = 'block'; return;
      }
      
      btn.textContent = 'SALVANDO...'; btn.disabled = true;
      status.style.display = 'none';
      
      try {
        const res = await fetch('/api/admin/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: sessionUser, password: sessionPass, price, targetCharacter })
        });
        const data = await res.json();
        
        if(!res.ok) throw new Error(data.error || 'Erro desconhecido');
        
        status.textContent = data.message;
        status.className = 'success'; status.style.display = 'block';
      } catch(err) {
        status.textContent = err.message;
        status.className = 'error'; status.style.display = 'block';
      } finally {
        btn.textContent = 'SALVAR CONFIGURAÇÕES'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
